services:
  genx71-autovj:
    build: .
    image: genx71-autovj:latest
    container_name: genx71-autovj
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    ports:
      - "${PORT:-8710}:8710"
    environment:
      - TZ=${TZ:-Europe/London}
      - HOST=0.0.0.0
      - PORT=8710
      - TTS_WORKER_URL=http://tts-worker:8711
      - LLM_WORKER_URL=http://llm-worker:11434
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./cache:/app/cache

  tts-worker:
    build: ./tts_worker
    image: genx71-tts-worker:latest
    container_name: genx71-tts-worker
    restart: unless-stopped
    init: true
    environment:
      - TZ=${TZ:-Europe/London}
      - TTS_HOST=0.0.0.0
      - TTS_PORT=8711
      - COQUI_TOS_AGREED=1
      - OMP_NUM_THREADS=${TTS_CPU_THREADS:-4}
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./data/tts_models:/root/.local/share/tts

  llm-worker:
    image: ollama/ollama:latest
    container_name: genx71-llm-worker
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/London}
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_THREAD=${LLM_CPU_THREADS:-4}
    volumes:
      - ./data/ollama_models:/root/.ollama


